name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run check

      - name: Test
        run: bun test

      - name: Set archive name
        id: archive
        run: echo "name=opencode-language-tutor-$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Create release archives
        env:
          ARCHIVE_NAME: ${{ steps.archive.outputs.name }}
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="$ARCHIVE_NAME/" -o "dist/$ARCHIVE_NAME.tar.gz" HEAD
          git archive --format=zip --prefix="$ARCHIVE_NAME/" -o "dist/$ARCHIVE_NAME.zip" HEAD

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
